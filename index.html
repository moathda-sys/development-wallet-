<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>محفظة التطوير</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  color:#192c42;
  background:#f3f6fa;
  font-synthesis:none;
}
*{box-sizing:border-box}
body{margin:0}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible{outline:3px solid #65a6e9;outline-offset:2px}
.hide{display:none!important}

.app{
  max-width:790px;
  min-height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
  gap:12px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:48px;
}

.header h1{
  font-size:clamp(21px,5vw,27px);
  margin:0;
  font-weight:850;
  letter-spacing:-.6px;
  white-space:nowrap;
}

.tabs{
  display:flex;
  gap:4px;
  background:#e5ebf3;
  border-radius:13px;
  padding:4px;
}

.tab{
  border:0;
  border-radius:10px;
  background:transparent;
  color:#61758f;
  font-size:13px;
  padding:9px 12px;
  font-weight:750;
}

.tab.active{
  background:#fff;
  color:#1f5388;
  box-shadow:0 2px 7px #273b5610;
}

.view{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.hero{
  border-radius:19px;
  background:#213e60;
  color:#f9fbff;
  padding:15px 17px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:10px;
}

.heroTop,.line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.heroTop b{font-size:14px}

.hero strong{
  font-size:clamp(21px,5.5vw,29px);
  font-weight:850;
  font-variant-numeric:tabular-nums;
}

.hero .muted{font-size:12px;color:#cbd9e8}

.track{
  height:5px;
  border-radius:20px;
  background:#dbe3ed;
  overflow:hidden;
}

.hero .track{background:#ffffff36}

.fill{
  height:100%;
  background:#5ed5bb;
  border-radius:20px;
  transition:width .25s;
}

.heroBottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.heroBottom small{font-size:11px;color:#d8e4f0}

.topGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.area{
  border:1px solid #dde5ed;
  border-radius:18px;
  padding:14px 15px;
  box-shadow:0 4px 14px #24395109;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:165px;
}

.english{background:#fff}
.knowledge{background:#eaf4f0;border-color:#d9e9e0}
.pro{
  background:#e5edf8;
  border-color:#d5e1f0;
}

.areatop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}

.name{
  font-size:clamp(17px,4.2vw,20px);
  font-weight:800;
  line-height:1.3;
}

.meta{
  font-size:12px;
  color:#718298;
  margin-top:3px;
}

.balance{
  font-size:11px;
  border:1px solid #dfe5ed;
  background:#f4f7fa;
  border-radius:9px;
  padding:6px 8px;
  white-space:nowrap;
  color:#53677b;
}

.knowledge .balance{background:#f6faf7}
.pro .balance{background:#f4f7fd}

.actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.add{
  background:#2267be;
  color:white;
  border:0;
  border-radius:11px;
  padding:10px 15px;
  font-weight:750;
  font-size:13px;
  white-space:nowrap;
}

.activity{
  flex:1;
  min-width:0;
  text-align:left;
  color:#6b8094;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.aux{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:24px;
}

.detail{
  border:0;
  background:transparent;
  padding:3px 0;
  color:#477398;
  font-size:12px;
  text-align:right;
}

.undo{
  background:#fff9ed;
  border:1px solid #f0dfbc;
  color:#9c6221;
  border-radius:8px;
  padding:5px 10px;
  font-size:11px;
}

.professionalList{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.sectionCaption{
  font-size:12px;
  color:#72849a;
  padding-right:3px;
}

.analyticsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.metric{
  background:#fff;
  border:1px solid #dfe7f0;
  border-radius:14px;
  padding:12px;
}

.metric label{
  font-size:11px;
  color:#708197;
  display:block;
}

.metric strong{
  font-size:21px;
  display:block;
  margin-top:6px;
}

.analyticsPanel{
  background:white;
  border:1px solid #dfe7f0;
  border-radius:16px;
  padding:14px;
  overflow:auto;
  flex:1;
}

.analyticsPanel h2{
  font-size:14px;
  margin:0 0 12px;
}

.barrow{margin:12px 0}
.barrow .line{font-size:12px}
.barrow .track{margin-top:6px}

.historyrow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid #edf1f5;
  padding:9px 0;
  font-size:12px;
}

.insight{
  font-size:12px;
  color:#65778e;
  line-height:1.7;
}

.linkBtn{
  border:1px solid #d5dfec;
  background:#f6f9fd;
  color:#345778;
  border-radius:10px;
  padding:9px 11px;
  font-size:12px;
}

.archive{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.backdrop{
  position:fixed;
  inset:0;
  z-index:10;
  background:#14274199;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal{
  background:white;
  border-radius:20px;
  padding:19px;
  width:min(100%,500px);
  max-height:80dvh;
  overflow-y:auto;
  box-shadow:0 18px 70px #152d4d50;
}

.modal h2{
  font-size:18px;
  margin:0 0 12px;
}

.modal textarea{
  width:100%;
  background:#f8fafc;
  border:1px solid #dce4ed;
  border-radius:12px;
  padding:12px;
  outline:none;
  height:160px;
  resize:vertical;
  line-height:1.8;
}

.modalLabel{
  font-size:12px;
  color:#718298;
  margin:12px 0 8px;
}

.durationGrid{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.durationBtn{
  border:1px solid #d8e2ef;
  background:#f7faff;
  color:#355476;
  border-radius:11px;
  padding:11px 15px;
  min-width:86px;
  font-weight:750;
}

.durationBtn.active{
  background:#2267be;
  color:#fff;
  border-color:#2267be;
}

.modalActions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.modalActions button{
  flex:1;
  padding:11px 12px;
  border-radius:11px;
  border:0;
  font-weight:700;
}

.save{background:#2267be;color:white}
.delete{background:#fff7f4;color:#a34839;border:1px solid #edd3cb}
.close{background:#eaf0f6;color:#3d5873}

.entryrow{
  padding:10px 0;
  border-top:1px solid #e7edf3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-size:12px;
}

.entryrow button{
  border:1px solid #e6d5cb;
  color:#a34839;
  border-radius:8px;
  padding:5px 8px;
  background:#fff7f4;
}

.mutedText{
  color:#8897a7;
  font-size:12px;
}

@media(max-width:640px){
  .topGrid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:520px){
  .header{
    flex-direction:row;
    align-items:center;
  }
  .topGrid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .area{
    min-height:155px;
    padding:12px;
  }
}

@media(max-width:430px){
  .topGrid{
    grid-template-columns:1fr 1fr;
  }
  .name{
    font-size:18px;
  }
  .add{
    padding:9px 13px;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>محفظة التطوير</h1>
    <nav class="tabs" aria-label="أقسام الموقع">
      <button class="tab active" data-tab="home">المحفظة</button>
      <button class="tab" data-tab="analytics">التحليل</button>
    </nav>
  </header>

  <section class="view" id="home">
    <div class="hero">
      <div class="heroTop">
        <b>إنجاز الأسبوع</b>
        <strong id="heroDone">0 / 12 س 15 د</strong>
      </div>
      <div class="track">
        <div class="fill" id="heroFill" style="width:0"></div>
      </div>
      <div class="heroBottom">
        <small id="heroPct">0% مكتمل</small>
        <small id="heroRemain">المتبقي 12 س 15 د</small>
      </div>
    </div>

    <div class="topGrid">
      <div id="english"></div>
      <div id="knowledge"></div>
    </div>

    <div class="sectionCaption">التطوير المهني</div>
    <div class="professionalList" id="professional"></div>
  </section>

  <section class="view hide" id="analytics">
    <div class="analyticsGrid">
      <div class="metric">
        <label>الأسبوع الحالي</label>
        <strong id="nowPct">0%</strong>
      </div>
      <div class="metric">
        <label>متوسط الأسابيع السابقة</label>
        <strong id="avgPct">—</strong>
      </div>
      <div class="metric">
        <label>إجمالي الساعات</label>
        <strong id="allTime">0 س</strong>
      </div>
      <div class="metric">
        <label>أسابيع مكتملة</label>
        <strong id="fullWeeks">0</strong>
      </div>
    </div>

    <div class="analyticsPanel">
      <h2>الالتزام حسب القسم</h2>
      <div id="sectionStats"></div>

      <h2 style="margin-top:20px">السجل الأسبوعي · ميلادي</h2>
      <div id="history"></div>

      <h2 style="margin-top:20px">قراءة الأداء</h2>
      <p class="insight" id="insight"></p>

      <div class="archive">
        <button class="linkBtn" id="exportBtn">نسخة احتياطية</button>
        <button class="linkBtn" id="importBtn">استيراد</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </section>
</div>

<div class="backdrop hide" id="overlay">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<script>
'use strict';

const defs = [
  {id:'english',name:'الإنجليزية',total:225,color:'#2865d6',type:'english',durations:[45]},
  {id:'knowledge',name:'المعرفة العامة',total:150,color:'#438866',type:'knowledge',durations:[30,45,60]},
  {id:'tools',name:'Excel / Primavera',total:60,color:'#5475ae',type:'pro',durations:[30,45,60]},
  {id:'ai',name:'الذكاء الاصطناعي',total:150,color:'#5475ae',type:'pro',durations:[30,45,60]},
  {id:'courses',name:'الكورسات التقنية',total:150,color:'#5475ae',type:'pro',durations:[30,45,60]}
];

const KEY = 'development-wallet-v1';
const BUDGET = 735; // 12h 15m
const $ = id => document.getElementById(id);
const sum = a => a.reduce((x,y)=>x+y,0);

const fmt = m => {
  m = Math.round(m);
  return (m>=60 ? Math.floor(m/60)+' س ' : '') + (m%60 ? m%60+' د' : '') || '0 د';
};

const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[c]));

function local(d){
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}

function weekKey(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay()+1)%7)); // week starts Saturday
  return local(x);
}

function freshWeek(){
  return {
    entries:[]
  };
}

function read(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.version===1 && s.weeks && typeof s.weeks==='object' && !Array.isArray(s.weeks)){
      return {...s, notes:s.notes || {}};
    }
  }catch(e){}
  return {version:1, weeks:{}, notes:{}};
}

let state = read();
let current = weekKey(new Date());
let currentModalSection = null;
let selectedDurations = [];

function persist(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
  }catch(e){
    console.warn('save failed', e);
  }
}

function ensure(){
  const k = weekKey(new Date());
  if(k !== current) current = k;
  if(!state.weeks[current]) state.weeks[current] = freshWeek();
  state.notes ??= {};
}

function wk(){ return state.weeks[current]; }

function entriesFor(d,w){
  return (w.entries || []).filter(x=>x.section===d.id);
}

function spent(d,w){
  return sum(entriesFor(d,w).map(x=>Number(x.minutes)||0));
}

function total(w){
  return sum(defs.map(d=>spent(d,w)));
}

function lastEntry(d,w){
  return entriesFor(d,w).at(-1);
}

function countText(d,w){
  const count = entriesFor(d,w).length;
  return count ? count+' جلسة' : 'لا توجد جلسات';
}

function makeCard(d, extraClass=''){
  const w = wk();
  const used = spent(d,w);
  const latest = lastEntry(d,w);

  return `
    <article class="area ${d.type} ${extraClass}">
      <div class="areatop">
        <div>
          <div class="name">${d.name}</div>
          <div class="meta">${fmt(d.total)} أسبوعيًا</div>
        </div>
        <span class="balance">${fmt(Math.max(0,d.total-used))} متبقية</span>
      </div>

      <div class="track">
        <div class="fill" style="width:${Math.min(100,(used/d.total)*100)}%;background:${d.color}"></div>
      </div>

      <div class="actions">
        <button class="add" data-session="${d.id}">جلسة +</button>
        <span class="activity">${latest ? esc(latest.title || fmt(latest.minutes)) : ''}</span>
      </div>

      <div class="aux">
        <button class="detail" data-detail="${d.id}">
          ✎ تفاصيل ${state.notes?.[d.id] ? '· محفوظة' : ''}
        </button>
        ${latest ? `<button class="undo" data-undo="${esc(latest.id)}">↶ تراجع</button>` : '<span></span>'}
      </div>
    </article>
  `;
}

function render(){
  ensure();
  persist();

  const t = total(wk());

  $('heroDone').textContent = fmt(t)+' / '+fmt(BUDGET);
  $('heroFill').style.width = Math.min(100,(t/BUDGET)*100)+'%';
  $('heroPct').textContent = Math.round((t/BUDGET)*100)+'% مكتمل';
  $('heroRemain').textContent = 'المتبقي '+fmt(Math.max(0,BUDGET-t));

  $('english').innerHTML = makeCard(defs[0]);
  $('knowledge').innerHTML = makeCard(defs[1]);
  $('professional').innerHTML = defs.slice(2).map(d=>makeCard(d)).join('');

  renderStats();
}

function openSessionModal(sectionId){
  const d = defs.find(x=>x.id===sectionId);
  currentModalSection = d;
  selectedDurations = [];

  $('modalTitle').textContent = 'جلسة · ' + d.name;

  $('modalBody').innerHTML = `
    <div class="modalLabel">اختر المدة — يمكنك اختيار أكثر من مدة</div>
    <div class="durationGrid">
      ${d.durations.map(min=>`
        <button class="durationBtn" data-duration="${min}">
          ${min===60 ? '1 س' : min+' د'}
        </button>
      `).join('')}
    </div>

    <div class="modalLabel">آخر جلسات هذا الأسبوع</div>
    <div id="miniHistory">
      ${renderMiniHistory(d)}
    </div>

    <div class="modalActions">
      <button class="save" id="addDurationsBtn">إضافة</button>
      <button class="delete" id="deleteDurationsBtn">حذف</button>
      <button class="close" id="closeModalBtn">إغلاق</button>
    </div>
  `;

  $('overlay').classList.remove('hide');

  $('modalBody').querySelectorAll('[data-duration]').forEach(btn=>{
    btn.onclick = ()=>{
      const n = Number(btn.dataset.duration);
      if(selectedDurations.includes(n)){
        selectedDurations = selectedDurations.filter(x=>x!==n);
        btn.classList.remove('active');
      }else{
        selectedDurations.push(n);
        btn.classList.add('active');
      }
    };
  });

  $('addDurationsBtn').onclick = addSelectedDurations;
  $('deleteDurationsBtn').onclick = deleteSelectedDurations;
  $('closeModalBtn').onclick = closeModal;
}

function renderMiniHistory(d){
  const list = entriesFor(d,wk()).slice().reverse();

  if(!list.length){
    return `<div class="mutedText">لا توجد جلسات مسجلة لهذا الأسبوع</div>`;
  }

  return list.map(x=>`
    <div class="entryrow">
      <span>${esc(x.title || fmt(x.minutes))} <span class="mutedText">· ${fmt(x.minutes)}</span></span>
      <button data-modalundo="${esc(x.id)}">تراجع</button>
    </div>
  `).join('');
}

function addSelectedDurations(){
  if(!currentModalSection) return;
  if(!selectedDurations.length){
    alert('اختر مدة واحدة على الأقل');
    return;
  }

  const d = currentModalSection;

  selectedDurations.forEach(min=>{
    wk().entries.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2),
      section: d.id,
      title: 'جلسة ' + d.name,
      minutes: min,
      at: new Date().toISOString()
    });
  });

  closeModal();
  render();
}

function deleteSelectedDurations(){
  if(!currentModalSection) return;

  const d = currentModalSection;
  const sectionEntries = entriesFor(d, wk());

  if(!sectionEntries.length){
    alert('لا توجد جلسات للحذف');
    return;
  }

  const removeCount = selectedDurations.length || 1;
  const idsToRemove = sectionEntries.slice(-removeCount).map(x=>x.id);

  wk().entries = wk().entries.filter(x=>!idsToRemove.includes(x.id));

  closeModal();
  render();
}

function openDetailsModal(sectionId){
  const d = defs.find(x=>x.id===sectionId);

  $('modalTitle').textContent = 'تفاصيل · ' + d.name;
  $('modalBody').innerHTML = `
    <textarea id="notesInput" placeholder="ما الذي تعمل عليه؟ ملاحظات مستمرة...">${esc(state.notes?.[d.id] || '')}</textarea>

    <div class="modalLabel">جلسات الأسبوع</div>
    <div id="detailHistory">
      ${renderMiniHistory(d)}
    </div>

    <div class="modalActions">
      <button class="save" id="saveDetailsBtn">حفظ</button>
      <button class="close" id="closeModalBtn">إغلاق</button>
    </div>
  `;

  $('overlay').classList.remove('hide');

  $('saveDetailsBtn').onclick = ()=>{
    state.notes[d.id] = $('notesInput').value;
    persist();
    closeModal();
    render();
  };

  $('closeModalBtn').onclick = closeModal;
}

function closeModal(){
  currentModalSection = null;
  selectedDurations = [];
  $('overlay').classList.add('hide');
}

$('overlay').onclick = e=>{
  if(e.target === $('overlay')) closeModal();
};

function handleCardClick(e){
  const b = e.target.closest('button');
  if(!b) return;

  if(b.dataset.session){
    openSessionModal(b.dataset.session);
    return;
  }

  if(b.dataset.detail){
    openDetailsModal(b.dataset.detail);
    return;
  }

  if(b.dataset.undo){
    if(confirm('التراجع عن آخر جلسة؟')){
      wk().entries = wk().entries.filter(x=>String(x.id)!==b.dataset.undo);
      render();
    }
    return;
  }
}

['english','knowledge','professional'].forEach(id=>{
  $(id).addEventListener('click', handleCardClick);
});

$('modalBody').addEventListener('click', e=>{
  const b = e.target.closest('[data-modalundo]');
  if(!b) return;

  if(!confirm('التراجع عن هذه الجلسة؟')) return;

  wk().entries = wk().entries.filter(x=>String(x.id)!==b.dataset.modalundo);

  const notesInput = $('notesInput');
  if(currentModalSection && notesInput){
    state.notes[currentModalSection.id] = notesInput.value;
  }

  render();

  if(currentModalSection){
    if($('notesInput')){
      openDetailsModal(currentModalSection.id);
    }else{
      openSessionModal(currentModalSection.id);
    }
  }
});

function renderStats(){
  const all = Object.entries(state.weeks).sort((a,b)=>b[0].localeCompare(a[0]));
  const past = all.filter(([k])=>k < current);

  $('nowPct').textContent = Math.round((total(wk())/BUDGET)*100)+'%';

  $('avgPct').textContent = past.length
    ? Math.round(sum(past.map(([,w])=>(total(w)/BUDGET)*100))/past.length)+'%'
    : '—';

  $('allTime').textContent = fmt(sum(all.map(([,w])=>total(w))));
  $('fullWeeks').textContent = past.filter(([,w])=>total(w)>=BUDGET-.01).length;

  $('sectionStats').innerHTML = defs.map(d=>{
    const p = past.length
      ? sum(past.map(([,w])=>(spent(d,w)/d.total)*100))/past.length
      : 0;

    return `
      <div class="barrow">
        <div class="line">
          <span>${d.name}</span>
          <b>${past.length ? Math.round(p)+'%' : '—'}</b>
        </div>
        <div class="track">
          <div class="fill" style="background:${d.color};width:${Math.min(100,p)}%"></div>
        </div>
      </div>
    `;
  }).join('');

  $('history').innerHTML = all.map(([k,w])=>`
    <div class="historyrow">
      <span>${k}${k===current ? ' · الحالي' : ''}</span>
      <b>${fmt(total(w))} · ${Math.round((total(w)/BUDGET)*100)}%</b>
    </div>
  `).join('');

  if(!past.length){
    $('insight').textContent = 'سيظهر تحليل المتوسط بعد اكتمال الأسبوع الأول.';
    return;
  }

  const ranked = defs.map(d=>({
    name:d.name,
    score: sum(past.map(([,w])=>(spent(d,w)/d.total)*100))/past.length
  })).sort((a,b)=>b.score-a.score);

  $('insight').textContent =
    `الأكثر انتظامًا: ${ranked[0].name} (${Math.round(ranked[0].score)}%). ` +
    `الأقل: ${ranked.at(-1).name} (${Math.round(ranked.at(-1).score)}%). ` +
    'المتوسط يحتسب الأسابيع المنتهية فقط.';
}

document.querySelectorAll('[data-tab]').forEach(btn=>{
  btn.onclick = ()=>{
    const tab = btn.dataset.tab;

    $('home').classList.toggle('hide', tab!=='home');
    $('analytics').classList.toggle('hide', tab!=='analytics');

    document.querySelectorAll('[data-tab]').forEach(x=>{
      x.classList.toggle('active', x===btn);
    });

    render();
  };
});

$('exportBtn').onclick = ()=>{
  persist();
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'development-wallet-backup-' + local(new Date()) + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

$('importBtn').onclick = ()=>$('importFile').click();

$('importFile').onchange = async e=>{
  const f = e.target.files[0];
  if(!f) return;

  try{
    const s = JSON.parse(await f.text());

    if(
      s.version!==1 ||
      !s.weeks ||
      typeof s.weeks!=='object' ||
      Array.isArray(s.weeks)
    ){
      throw Error();
    }

    if(confirm('استبدال بياناتك الحالية بالنسخة الاحتياطية؟')){
      state = {...s, notes:s.notes || {}};
      persist();
      render();
    }
  }catch{
    alert('النسخة الاحتياطية غير صالحة');
  }

  e.target.value = '';
};

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) render();
});

window.addEventListener('focus', render);

setInterval(()=>{
  if(weekKey(new Date()) !== current) render();
}, 60000);

render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
